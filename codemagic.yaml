workflows:
  hptsmart-ios-1-1-2:
    name: HPTSmart 1.1.2 iOS (Capacitor 8)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.hungphutrung.hptsmart

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Create iOS native project
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        script: |
          npm run cap:sync:ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Apply HPTSmart iOS local-network permissions
        script: |
          node scripts/patch-ios.cjs

      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build HPTSmart IPA
        script: |
          cd ios/App
          xcode-project build-ipa             --workspace "App.xcworkspace"             --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
